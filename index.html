<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackoVex - Tracker Ecosystem</title>
    
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090B',
                        accent: '#00F0FF',
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-background text-white font-sans h-screen w-screen overflow-hidden relative">

    <!-- BOOT SCREEN -->
    <div id="boot-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-background transition-all duration-700">
        <!-- Replace src with your uploaded image on github -->
        <img src="logo.png" alt="Logo" class="w-32 h-32 mb-4 animate-pulse-slow">
        <h1 class="text-3xl font-bold tracking-widest text-accent text-glow">TrackoVex</h1>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="h-full w-full max-w-md mx-auto flex flex-col p-6 opacity-0 transition-opacity duration-1000 hidden">
        
        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="flex-1 flex flex-col h-full fade-in">
            <div class="flex justify-between items-center mb-8 pt-4">
                <h2 class="text-2xl font-bold tracking-wide">My Items</h2>
                <button onclick="openPairing()" class="w-10 h-10 rounded-full glass-card text-accent flex items-center justify-center hover:bg-white/10 transition">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-4" id="tags-grid">
                <!-- Tags injected via JS -->
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detail-view" class="flex-1 flex flex-col h-full hidden fade-in overflow-y-auto no-scrollbar pb-10">
            <button onclick="showDashboard()" class="flex items-center text-accent mb-6 pt-4 w-fit">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> Back
            </button>

            <div class="flex flex-col items-center justify-center mb-8 relative">
                <!-- Radar animation -->
                <div id="radar-pulse" class="absolute inset-0 m-auto w-24 h-24 bg-accent/30 rounded-full hidden"></div>
                
                <div id="detail-emoji" class="text-7xl mb-4 relative z-10"></div>
                <div class="flex items-center space-x-3 cursor-pointer group">
                    <h2 id="detail-name" class="text-3xl font-bold tracking-wide"></h2>
                    <i data-lucide="edit-2" class="w-4 h-4 text-gray-500"></i>
                </div>
                <p id="detail-location" class="text-gray-400 text-sm mt-2"></p>
            </div>

            <!-- Stats -->
            <div class="flex justify-around mb-6 p-4 rounded-3xl glass-card">
                <div class="flex flex-col items-center">
                    <i data-lucide="battery" class="text-accent mb-1"></i>
                    <span id="detail-battery" class="text-xs text-gray-400"></span>
                </div>
                <div class="w-px bg-white/10"></div>
                <div class="flex flex-col items-center">
                    <i data-lucide="wifi" class="text-accent mb-1"></i>
                    <span class="text-xs text-gray-400">Excellent Signal</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button id="btn-locate" onclick="toggleLocate()" class="py-4 rounded-3xl glass-card text-accent flex flex-col items-center transition-all">
                    <i data-lucide="search" class="mb-2"></i>
                    <span id="text-locate">Locate</span>
                </button>
                <button id="btn-alert" onclick="toggleAlert()" class="py-4 rounded-3xl glass-card text-white flex flex-col items-center transition-all">
                    <i data-lucide="bell" id="icon-bell" class="mb-2"></i>
                    <span id="text-alert">Play Sound</span>
                </button>
            </div>

            <!-- Map Snippet -->
            <div class="mb-6 rounded-3xl h-40 bg-zinc-900 border border-glassBorder relative flex items-center justify-center overflow-hidden">
                <i data-lucide="map-pin" class="text-accent opacity-50 w-8 h-8"></i>
                <div class="absolute bottom-3 left-4 right-4 p-3 rounded-2xl bg-black/60 backdrop-blur-md border border-white/5 text-xs text-center">
                    Last seen: 123 Neon Avenue • 10 mins ago
                </div>
            </div>
            
            <!-- Settings -->
            <button class="w-full p-4 rounded-2xl border border-red-500/30 text-red-400 text-sm font-semibold flex items-center justify-center space-x-2">
                <i data-lucide="trash-2" class="w-4 h-4"></i> <span>Remove TrackoVex</span>
            </button>
        </div>
    </div>

    <!-- PAIRING MODAL -->
    <div id="pairing-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closePairing()"></div>
        <div class="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0a0a0c] border-t border-glassBorder rounded-t-[40px] p-8 transform translate-y-full transition-transform duration-500" id="pairing-sheet">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-8"></div>
            
            <div class="relative w-48 h-48 mx-auto mb-8 flex items-center justify-center">
                <div class="tracker-3d w-24 h-24 rounded-full bg-gradient-to-br from-gray-800 to-black border-4 border-gray-700 flex items-center justify-center z-10">
                    <div class="w-16 h-16 rounded-full border border-accent/20 bg-glass flex items-center justify-center">
                        <span class="text-accent font-bold text-xl text-glow">TV</span>
                    </div>
                </div>
                <div class="absolute bottom-0 w-32 h-4 bg-accent/20 blur-xl rounded-full"></div>
            </div>

            <h3 class="text-2xl font-bold text-center mb-2">TrackoVex Found</h3>
            <p class="text-center text-gray-400 mb-8 text-sm">Bring your tag closer to pair it securely.</p>
            
            <button onclick="closePairing()" class="w-full py-4 rounded-full bg-accent text-background font-bold text-lg button-glow">
                Connect
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
